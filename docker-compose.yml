services:
  wol-switch:
    image: lostome/wol_secure_lightswitch:latest
    container_name: wol_secure_lightswitch
    restart: unless-stopped
    network_mode: host # required for Wake-on-LAN broadcasts
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${PORT:-7500}/healthz"]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      - PORT=7500
      - BIND_ADDRESS=127.0.0.1
      - TZ=Europe/Rome
      - INITIALIZE_DATA=true
      - GIN_MODE=release
    volumes:
      - wol_secure_lightswitch_data:/app/data

volumes:
  wol_secure_lightswitch_data:
    name: wol_secure_lightswitch_data
