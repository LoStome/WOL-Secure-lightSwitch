version: '3.8'

services:
  wol-switch:
    image: lostome/wol_secure_lightswitch:latest
    platform: linux/arm64 # or linux/amd64
    container_name: wol_secure_lightswitch
    restart: unless-stopped
    network_mode: host # fundamental for wake on lan
    environment:
      - PORT=7500 # change this port to your own liking
      - TZ=Europe/Rome # change this to your desired timezone
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
      - SSH_KNOWN_HOSTS_FILE=/run/secrets/ssh_known_hosts
      - GIN_MODE=release 
    secrets:
      - jwt_secret
      - source: ssh_private_key
        target: ssh_private_key
        mode: 0400
      - source: ssh_known_hosts
        target: ssh_known_hosts
        mode: 0444
    volumes:
      - ./data:/app/data # here you have to put your hosts.yaml. Follow the example in hosts.yaml.example

secrets:
  jwt_secret:
    file: ./data/jwt_secret
  ssh_private_key:
    file: /home/user/.ssh/wol_switch_ed25519 # dedicated key for this service only
  ssh_known_hosts:
    file: /home/user/.ssh/known_hosts
